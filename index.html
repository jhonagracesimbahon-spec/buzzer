<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BUZZER</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
      font-size: clamp(2rem, 8vw, 4rem);
      letter-spacing: 0.05em;
    }

    .buzzer {
      width: min(70vw, 320px);
      height: min(70vw, 320px);
      border: 18px solid #4b5563;
      border-radius: 50%;
      background: linear-gradient(145deg, #ff1744, #b00020);
      color: white;
      cursor: pointer;
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: bold;
      box-shadow:
        inset 0 10px 20px rgba(255, 255, 255, 0.25),
        inset 0 -15px 25px rgba(0, 0, 0, 0.35),
        0 20px 35px rgba(0, 0, 0, 0.45);
      transition:
        transform 0.08s,
        filter 0.08s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .buzzer:hover {
      filter: brightness(1.15);
    }

    .buzzer:active,
    .buzzer.active {
      transform: scale(0.92);
      filter: brightness(0.8);
    }

    .status {
      margin-top: 25px;
      color: #d1d5db;
      font-size: 1rem;
    }

    body.shake {
      animation: shake 0.18s linear infinite;
    }

    @keyframes shake {
      0% {
        transform: translate(0, 0) rotate(0deg);
      }

      25% {
        transform: translate(-4px, 3px) rotate(-1deg);
      }

      50% {
        transform: translate(4px, -3px) rotate(1deg);
      }

      75% {
        transform: translate(-3px, -2px) rotate(0deg);
      }

      100% {
        transform: translate(0, 0) rotate(0deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body.shake {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>BUZZ MEE</h1>

    <button
      class="buzzer"
      id="buzzer"
      type="button"
      aria-label="Start or stop the buzzer music"
      aria-pressed="false"
    >
      PRESS
    </button>

    <p class="status" id="status">
      Click, tap, or press Space to start
    </p>
  </main>

  <!-- Keep wow.mp3 in the same folder as this HTML file -->
  <audio
    id="buzzerSound"
    src="ngarap.mp3"
    preload="auto"
  ></audio>

  <script>
    const buzzer = document.getElementById("buzzer");
    const buzzerSound = document.getElementById("buzzerSound");
    const statusText = document.getElementById("status");

    // 1.0 is the highest volume allowed by the browser.
    buzzerSound.volume = 1.0;

    function startBuzzer() {
      buzzerSound.currentTime = 0;
      buzzerSound.volume = 1.0;

      const playPromise = buzzerSound.play();

      if (playPromise !== undefined) {
        playPromise
          .then(() => {
            buzzer.classList.add("active");
            document.body.classList.add("shake");

            buzzer.setAttribute("aria-pressed", "true");
            statusText.textContent = "Music playing — press again to stop";

            if ("vibrate" in navigator) {
              navigator.vibrate([120, 60, 120]);
            }
          })
          .catch((error) => {
            console.error("Unable to play wow.mp3:", error);
            statusText.textContent =
              "Could not play wow.mp3. Check the file name and location.";
          });
      }
    }

    function stopBuzzer() {
      buzzerSound.pause();
      buzzerSound.currentTime = 0;

      buzzer.classList.remove("active");
      document.body.classList.remove("shake");

      buzzer.setAttribute("aria-pressed", "false");
      statusText.textContent = "Click, tap, or press Space to start";

      if ("vibrate" in navigator) {
        navigator.vibrate(0);
      }
    }

    function toggleBuzzer() {
      if (buzzerSound.paused) {
        startBuzzer();
      } else {
        stopBuzzer();
      }
    }

    // Click or tap toggles the music.
    buzzer.addEventListener("click", toggleBuzzer);

    // Space key toggles the music.
    document.addEventListener("keydown", (event) => {
      if (event.code === "Space" && !event.repeat) {
        event.preventDefault();
        toggleBuzzer();
      }
    });

    // Reset the button if the music reaches its end.
    buzzerSound.addEventListener("ended", () => {
      buzzer.classList.remove("active");
      document.body.classList.remove("shake");

      buzzer.setAttribute("aria-pressed", "false");
      statusText.textContent = "Click, tap, or press Space to start";

      if ("vibrate" in navigator) {
        navigator.vibrate(0);
      }
    });

    // Handle loading or file errors.
    buzzerSound.addEventListener("error", () => {
      statusText.textContent =
        "Audio file not found. Put wow.mp3 beside this HTML file.";
    });
  </script>
</body>
</html>
